name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and Robolectric tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r = ET.parse(f).getroot()
              t, fl, e, sk = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += t; fail += fl; err += e; skip += sk
              print(f"{r.get('name')}: tests={t} failures={fl} errors={e} skipped={sk}")
              for case in r.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"  FAILED {case.get('name')}: {(bad.get('message') or '')[:300]}")
          print(f"TOTAL tests={total} failures={fail} errors={err} skipped={skip}")
          PY

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Inspect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "APK: $APK"
          ls -l "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)aapt2
          "$AAPT2" dump badging "$APK" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable-activity)" | tee app/build/outputs/apk/debug/BADGING.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daymark-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/BADGING.txt

      - name: Publish APK to ci-apk branch
        if: success() && github.event_name == 'push'
        run: |
          set -e
          OUT=$(mktemp -d)
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/SHA256SUMS.txt app/build/outputs/apk/debug/BADGING.txt "$OUT"/
          echo "source_branch=${GITHUB_REF_NAME}" > "$OUT/BUILD_INFO.txt"
          echo "source_commit=${GITHUB_SHA}" >> "$OUT/BUILD_INFO.txt"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b ci-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .
          git commit -qm "Debug APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk" || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Instrumented tests and UI smoke test (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest > emulator-androidtest.log 2>&1 && echo PASS > androidtest-status || echo FAIL > androidtest-status
            tail -n 60 emulator-androidtest.log
            adb shell settings put global hide_error_dialogs 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            sleep 30
            python3 .github/scripts/ui_smoke.py smoke
            grep -q PASS androidtest-status

      - name: Publish screenshots to ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          set -e
          [ -d smoke ] || exit 0
          OUT=$(mktemp -d)
          cp -r smoke/. "$OUT"/
          cp emulator-androidtest.log "$OUT"/ 2>/dev/null || true
          mkdir -p "$OUT/androidTest-results"
          cp -r app/build/outputs/androidTest-results/connected/. "$OUT/androidTest-results/" 2>/dev/null || true
          echo "source_commit=${GITHUB_SHA}" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .
          git commit -qm "Emulator smoke results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            smoke/
            emulator-androidtest.log
            app/build/reports/androidTests/
