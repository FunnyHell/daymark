name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Persistent signing key (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daymark-debug-keystore-v1

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Every build must be signed with the same key, or Android refuses to install it as an update.
          # A repository secret (if set) is the permanent key; otherwise the key is kept in the Actions cache.
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Signing key: repository secret"
          elif [ -f ~/.android/debug.keystore ]; then
            echo "Signing key: cached"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing key: created (saved to the cache at the end of this job)"
          fi
          echo "DAYMARK_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 "SHA256:"

      - name: Unit and Robolectric tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r = ET.parse(f).getroot()
              t, fl, e, sk = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += t; fail += fl; err += e; skip += sk
              print(f"{r.get('name')}: tests={t} failures={fl} errors={e} skipped={sk}")
              for case in r.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"  FAILED {case.get('name')}: {(bad.get('message') or '')[:300]}")
          print(f"TOTAL tests={total} failures={fail} errors={err} skipped={skip}")
          PY

      - name: Lint (APIs missing on older Android versions)
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Inspect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "APK: $APK"
          ls -l "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)aapt2
          "$AAPT2" dump badging "$APK" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable-activity)" | tee app/build/outputs/apk/debug/BADGING.txt

      - name: Check the APK is signed with the app's key
        run: |
          # Android installs an update only when it is signed with the same key as the installed app. The key's
          # certificate fingerprint is in the repository; a build signed with any other key fails here and is
          # never published.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ACTUAL=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //')
          EXPECTED=$(tr -d ' \n:' < app/signing-cert.sha256 | tr 'A-F' 'a-f')
          echo "APK certificate SHA-256: $ACTUAL"
          echo "Expected:                $EXPECTED"
          echo "$ACTUAL" > apk-cert.txt
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::APK is signed with a different key; it would not install as an update"; exit 1; }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daymark-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/BADGING.txt

      - name: Live check of the quest place search (public Overpass servers)
        continue-on-error: true
        run: |
          OVERPASS_LIVE=1 ./gradlew --no-daemon testDebugUnitTest --tests '*QuestRulesTest.liveSearch*'
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*QuestRulesTest.xml'):
              out = ET.parse(f).getroot().findtext('system-out') or ''
              print(out)
          PY

      - name: Publish APK to ci-apk branch
        if: success() && github.event_name == 'push'
        run: |
          set -e
          OUT=$(mktemp -d)
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/SHA256SUMS.txt app/build/outputs/apk/debug/BADGING.txt "$OUT"/
          # Room schema files generated by the build, so they can be committed to app/schemas.
          cp -r app/schemas "$OUT"/schemas 2>/dev/null || true
          echo "source_branch=${GITHUB_REF_NAME}" > "$OUT/BUILD_INFO.txt"
          echo "source_commit=${GITHUB_SHA}" >> "$OUT/BUILD_INFO.txt"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$OUT/BUILD_INFO.txt"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$OUT/BUILD_INFO.txt"
          echo "apk_cert_sha256=$(cat apk-cert.txt)" >> "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b ci-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .
          git commit -qm "Debug APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk" || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Instrumented tests and UI smoke test (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest > emulator-androidtest.log 2>&1 && echo PASS > androidtest-status || echo FAIL > androidtest-status
            tail -n 60 emulator-androidtest.log
            adb shell settings put global hide_error_dialogs 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            sleep 30
            python3 .github/scripts/ui_smoke.py smoke
            grep -q PASS androidtest-status

      - name: Publish screenshots to ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          set -e
          [ -d smoke ] || exit 0
          OUT=$(mktemp -d)
          cp -r smoke/. "$OUT"/
          cp emulator-androidtest.log "$OUT"/ 2>/dev/null || true
          mkdir -p "$OUT/androidTest-results"
          cp -r app/build/outputs/androidTest-results/connected/. "$OUT/androidTest-results/" 2>/dev/null || true
          find app/build/outputs -name 'week-widget.png' -exec cp {} "$OUT"/ \; 2>/dev/null || true
          echo "source_commit=${GITHUB_SHA}" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .
          git commit -qm "Emulator smoke results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            smoke/
            emulator-androidtest.log
            app/build/reports/androidTests/

  # Starts the app on several Android versions in a tablet profile and fails on any crash; then draws every
  # widget there the way a launcher gets it.
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 30, 31, 33, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk" || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Start, background and resume the app (API ${{ matrix.api-level }}, tablet)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          profile: pixel_c
          cores: 4
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/startup_check.sh
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.funnyhell.daymark.WidgetHostInstrumentedTest,io.github.funnyhell.daymark.WidgetRenderInstrumentedTest

